name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the checker
        run: python3 -I -m unittest discover -s tests
      - name: Test the skill scripts
        run: |
          for d in .agents/skills/*/scripts; do
            python3 -I -m unittest discover -s "$d" -p 'test_*.py'
          done
      - name: Test the evaluator isolation against Docker
        env:
          GSF_DOCKER_TESTS: "1"
        run: python3 -I -m unittest discover -s .agents/skills/geo-software-eval/scripts -p 'test_check_isolation.py' -v
      - name: Test the evals harness
        run: |
          python3 -m pip install --quiet 'pyproj==3.7.2'
          python3 -m unittest discover -s evals -p 'test_*.py'
          python3 -m unittest discover -s evals/night -p 'test_*.py'
      - name: Check the skills
        run: python3 -I scripts/check.py
