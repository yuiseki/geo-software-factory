<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東京23区のセブン-イレブンの店舗数</title>
<style>
  html, body { margin: 0; height: 100%; font-family: "Noto Sans CJK JP", sans-serif; }
  #map { width: 1200px; height: 900px; }
  .panel { position: absolute; top: 16px; left: 16px; background: rgba(255,255,255,.92); padding: 12px 16px; border-radius: 6px; z-index: 10; }
  .panel h1 { font-size: 20px; margin: 0 0 8px; }
  .bar { width: 240px; height: 12px; background: linear-gradient(to right, #fff5eb, #fd8d3c, #7f2704); }
  .ticks { display: flex; justify-content: space-between; width: 240px; font-size: 12px; }
  .note { font-size: 11px; margin-top: 6px; color: #333; }
</style>
</head>
<body>
<div class="panel">
  <h1>東京23区のセブン-イレブンの店舗数 (区ごと)</h1>
  <div class="bar"></div>
  <div class="ticks"><span>30 店</span><span>130 店</span></div>
  <div class="note">店舗: OpenStreetMap (2026-08-31 時点、brand:wikidata=Q259340 ほか)<br>
  区の境界: 国土数値情報 (行政区域データ 2026 年) (国土交通省) を加工して作成</div>
</div>
<div id="map" class="geolonia"
  data-lat="35.69" data-lng="139.70" data-zoom="10.3"
  data-geojson="./wards.geojson"
  data-choropleth="count"
  data-choropleth-colors="#fff5eb,#fd8d3c,#7f2704"
  data-choropleth-range="30,130"
  data-marker="off"></div>
<script src="https://cdn.geolonia.com/embed/v6/embed?geolonia-api-key=YOUR-API-KEY"></script>
</body>
</html>
